# LQR controller fit + stability analysis for the pendulum experiment.

lqr_controller_cfg:
  q_scale: 1.0
  q_epsilon_scale: 0.0
  r_scale: 1.0
  scale_B: false
  max_tracking_error_x: 0.3       # 1 - cos(15deg), sin(15deg), 1
  max_displacement_x: 0.57        # max system displacement (0.4, 0.4, 0.8)
  controllable_subspace: false
  ctrl_threshold: null            # null = machine epsilon default

  stability_analysis:
    use_eigen_bound: true
    use_lyapunov_bound: true
    use_m_free_bound: false
    optimize_lyapunov_P: true
    use_alpha_bound: false
    alpha_epsilon_x: 0.3
    alpha_eta: 0.1

  koopman_experiment_name: "pendulum_default"
  output_name: "pendulum_default"
