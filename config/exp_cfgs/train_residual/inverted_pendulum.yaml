# Residual policy (SAC) training for InvertedPendulum-v4.

train_residual_cfg:
  gamma_worst_case: 0.1
  reward_weight: 1.0
  pred_error_space: "latent"
  z_ref_max_mode: "action_bound"
  obs_augmentation: "both"
  disable_action_augmentation: false

  num_envs: 8
  total_timesteps: 100000
  eval_interval: 5000
  batch_size: 256
  lr: 3.0e-4
  actor_hidden_size: 64
  actor_hidden_layers: 2
  critic_hidden_size: 256
  critic_hidden_layers: 2
  gamma: 0.99
  tau: 0.005
  initial_entropy_value: 1.0
  random_timesteps: 1000
  learning_starts: 1000
  memory_size: 100000

  koopman_path: "results/inverted_pendulum"
  controller_path: "results/inverted_pendulum/lqr/inverted_pendulum"
  experiment_name: "inverted_pendulum"
  seed: 42
