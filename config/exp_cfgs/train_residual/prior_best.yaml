# Residual policy (SAC) training for the prior_best experiment.

train_residual_cfg:
  z_ref_limit: 1.0
  num_envs: 8
  total_timesteps: 100000
  eval_interval: 5000
  batch_size: 256
  lr: 3.0e-4
  actor_hidden_size: 64
  actor_hidden_layers: 2
  critic_hidden_size: 256
  critic_hidden_layers: 2
  gamma: 0.99
  tau: 0.005
  initial_entropy_value: 1.0
  random_timesteps: 1000
  learning_starts: 1000
  memory_size: 100000

  koopman_experiment_name: "prior_best"
  lqr_name: "prior_best"
  experiment_name: "prior_best"
  seed: 42
