# Data gathering for the pendulum experiment.

gather_data_cfg:
  env_name: "Pendulum-v1"
  env_kwargs:
    obs_type: "cos_sin"            # "cos_sin" (3D) or "theta" (2D)
    limited_spawn: false
    spawn_angle_range: 180.0
    friction_coeff: 0.0

  num_trajectories: 200
  max_episode_steps: 200

  base_policy:
    name: "none"                  # "none", "energy", "bang_energy", "pd"
    params:
      kp: 10.0
      kd: 2.0
      ke: 1.0
      gamma: 0.9
      switch_angle: 30.0

  perturbation:
    analytical_B_policy: "none"   # "none", "energy", "bang_energy"
    params:
      kp: 10.0
      kd: 2.0
      ke: 1.0
      gamma: 0.9
      switch_angle: 30.0
    normalize_analytical_B: false
    perturb_scale: 1.0
    fix_perturb_range: false
    hold_steps: 5

  dataset_name: "pendulum_default"
  seed: 42
