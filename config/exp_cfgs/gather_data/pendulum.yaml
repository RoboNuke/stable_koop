# Data gathering for the pendulum experiment.
# One call → one dataset. Toggle `perturbations.enabled` to switch between
# base-policy-only data and perturbed data without changing anything else.

gather_data_cfg:
  env_name: "Pendulum-v1"
  env_kwargs:
    obs_type: "cos_sin"            # "cos_sin" (3D) or "theta" (2D)
    limited_spawn: false
    spawn_angle_range: 180.0
    friction_coeff: 0.0

  num_trajectories: 200
  max_episode_steps: 200

  base_policy:
    name: "none"                  # "none", "energy", "bang_energy", "pd"
    params:
      kp: 10.0
      kd: 2.0
      ke: 1.0
      gamma: 0.9
      switch_angle: 30.0

  perturbations:
    enabled: true                 # set false for base-policy-only data
    perturb_scale: 1.0
    fix_perturb_range: false
    hold_steps: 5

  dataset_name: "pendulum_default"
  seed: 42
