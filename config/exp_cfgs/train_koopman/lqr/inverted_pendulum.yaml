# Koopman training + LQR controller fit for InvertedPendulum-v4.
# Joint paradigm with analytical B refit on the perturbed dataset (mirrors
# the legacy A-then-B flow): the base dataset has identical action and
# base_action, so `use_action_delta: true` produces a zero action channel
# during joint training → only A learns. The analytical B refit then runs
# on the perturbed dataset.

train_koopman_cfg:
  approach: "joint"
  k_type: "schur"
  encoder_type: "linear"                # learned encoder (no env-specific trig lift)

  latent_dim: 4
  rho: 1.2
  encoder_spec_norm: false
  encoder_latent: 80
  init_b_in_a: true
  prepend_state: false
  prepend_control: false

  augmentation:
    prepend_base_action: false
    use_action_delta: false              # action=0 for base-only data → only A learns
    obs_scale_source: "observed"
    act_scale_source: "env"

  visualization:
    enabled: true
    object_pos_obs_indices: [0, 1]   # cart_x, theta
    goal_obs_indices: null
    voxel_size: 0.05
    gif_seconds: 5.0

  horizon: 5
  batch_size: 2048
  num_workers: 4
  lr: 1.0e-2
  weight_decay: 1.0e-5
  num_epochs: 30

  recon_pretrain_epochs: 5
  recon_pretrain_lr: 1.0e-3
  recon_pretrain_bilip: false
  recon_pretrain_bilip_weight: 1.0

  loss_threshold: -10.0

  scheduler_step: 100
  scheduler_gamma: 0.5

  cosine_scheduler: false
  cosine_T_max: 200
  cosine_eta_min: 1.0e-6

  riemannian_optimizer: false
  vectorize_rollout: true
  torch_compile: true

  grad_clip: false
  grad_clip_type: "norm"
  grad_clip_value: 1.0

  losses:
    recon_weight: 0.1
    pred_weight: 0.1
    latent_consistency_weight: 1.0

    latent_rollout_loss: false
    latent_rollout_weight: 1.0
    x_pred_weight: 1.0

    l_inf_pred_loss: true
    l_inf_pred_weight: 1.0e-8

    controllability_loss: false
    ctrl_weight: 0.1

    bi_lipschitz_loss: false
    bilip_weight: 2.0
    bilip_m_target: 1.2

    spectral_loss: false
    spectral_weight: 0.01

    normality_loss: false
    normality_weight: 2.0

    cl_normality_loss: false
    cl_normality_weight: 1.0

    b_eigen_loss: false
    b_eigen_weight: 1.0
    b_eigen_min_scale: 0.3

    b_scale_loss: false
    b_scale_weight: 1.0
    b_scale_target: 1.0

    b_min_sv_loss: false
    b_min_sv_weight: 1.0
    b_min_sv_target: 0.1

    eig_spread_loss: false
    eig_spread_weight: 1.0
    eig_spread_min_gap: 0.1

    unstable_ctrl_loss: false
    unstable_ctrl_weight: 0.05
    unstable_ctrl_threshold: 1.0

    unit_circle_gap_loss: false
    unit_circle_gap_weight: 1.0
    unit_circle_gap: 0.05

    upper_lipschitz_loss: false
    upper_lip_weight: 1.0
    upper_lip_m_max: 1.25

  b_fitting:
    enabled: false
    perturbed_dataset_name: "inverted_pendulum_pert"
    method: "least_squares_projected"
    ctrl_lambda: 0.1
    train_steps: 500
    lr: 1.0e-3
    log_interval: 100

  seed: 42
  log_interval: 1
  experiment_name: "okay_schur_a1-2_noPend"
  dataset_name: "okay_inverse_pendulumv2"


lqr_controller_cfg:
  # ---- prepend_state=false: actual_latent = latent_dim = 4 ----
  Q_diag: [1, 1, 1, 1]
  R_diag: [1]                # action_dim = 1
  C_mask: [1, 1, 1, 1]       # output = all 4 learned latent dims
                             # (no real-state slice exists in the latent when
                             #  prepend_state=false — pick whichever subset of
                             #  learned dims you want the β-bound to certify)

  # ---- prepend_state=true (original): actual_latent = 4 + 4 = 8 ----
  # Uncomment the block below (and re-comment the one above) to switch back.
  Q_diag: [1, 1, 1, 1, 1, 1, 1, 1]
  R_diag: [1]
  C_mask: [0, 0, 1, 1, 0, 0, 0, 0]    # pole slice of prepended state
  scale_B: false

  stability_analysis:
    epsilon_x: 0.346  # <5deg <11.5deg/sec (.2 rad/sec) <1 cm/s < 1cm
    ctrl_percentages: [0.0] #, 0.1, 0.2, 0.30, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
    optimizer: "beta"       # "none" | "matching" | "beta"
    beta_rho_target: 0.0    # PBH detectability threshold (only used for "beta")
    # No physical cart/pole/enc partition with prepend_state=false (the
    # latent is entirely learned features). For the prepend_state=true
    # variant, uncomment the block below.
    #mode_projection_groups: null
    mode_projection_groups:
      cart: [0, 1]          # x, x_dot
      pole: [2, 3]          # θ, θ_dot
      enc:  [4, 5, 6, 7]    # learned encoder dims

  eval_cfg_path: "config/exp_cfgs/eval/inverted_pendulum.yaml"

  koopman_experiment_name: "okay_schur"
  output_name: "okay_schur_a1-2_noPend" #"okay_schur"
