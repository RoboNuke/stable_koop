# Koopman training + LQR controller fit for the pendulum experiment.
# Both stages live in one file; `python -m train_koopman --config <this file>`
# runs training and then the LQR fit. Pass `--skip_train` to fit the
# controller against an already-saved model.

train_koopman_cfg:
  approach: "joint"           # "two_phase" or "joint"
  k_type: "schur"            # "cayley", "schur", "normalized", "complex_normal", "unbounded"
  encoder_type: "trig"          # "linear" or "trig"

  latent_dim: 2
  rho: 0.95
  encoder_spec_norm: false
  encoder_latent: 16
  init_b_in_a: false
  # prepending on latent side
  prepend_state: true
  prepend_control: false

  augmentation:                   # how the dataset is projected for training
    #prepending on observation
    prepend_base_action: false     # two-phase: state ← [obs; base_action]
    use_action_delta: true        # koopman action ← (action − base_action)
    obs_scale_source: "env"       # "env", "observed", or "none"
    act_scale_source: "env"

  horizon: 5
  batch_size: 2048
  num_workers: 4
  lr: 1.0e-1 #5.0e-4
  weight_decay: 1.0e-4
  num_epochs: 1000
  recon_pretrain_epochs: 20
  recon_pretrain_lr: 1.0e-3
  recon_pretrain_bilip: false
  recon_pretrain_bilip_weight: 1.0

  loss_threshold: 0.0009

  scheduler_step: 200 #100
  scheduler_gamma: 0.5 #0.1

  cosine_scheduler: false
  cosine_T_max: 200
  cosine_eta_min: 1.0e-6

  riemannian_optimizer: false
  vectorize_rollout: true
  torch_compile: true

  grad_clip: false #true
  grad_clip_type: "norm"
  grad_clip_value: 1.0

  losses:
    recon_weight: 0.1
    pred_weight: 0.1
    latent_consistency_weight: 1.0

    latent_rollout_loss: false
    latent_rollout_weight: 1.0
    x_pred_weight: 0.1

    l_inf_pred_loss: true
    l_inf_pred_weight: 1.0e-9

    controllability_loss: false
    ctrl_weight: 0.1

    bi_lipschitz_loss: false
    bilip_weight: 2.0
    bilip_m_target: 1.0

    spectral_loss: false
    spectral_weight: 0.01

    normality_loss: false
    normality_weight: 2.0

    cl_normality_loss: false
    cl_normality_weight: 1.0

    b_eigen_loss: false
    b_eigen_weight: 1.0
    b_eigen_min_scale: 0.3

    b_scale_loss: false
    b_scale_weight: 1.0
    b_scale_target: 1.0

    b_min_sv_loss: false
    b_min_sv_weight: 1.0
    b_min_sv_target: 0.1

    eig_spread_loss: false
    eig_spread_weight: 1.0
    eig_spread_min_gap: 0.1

    unstable_ctrl_loss: false
    unstable_ctrl_weight: 0.05
    unstable_ctrl_threshold: 1.0

    unit_circle_gap_loss: false
    unit_circle_gap_weight: 1.0
    unit_circle_gap: 0.05

    upper_lipschitz_loss: false
    upper_lip_weight: 1.0
    upper_lip_m_max: 1.25

  b_fitting:
    enabled: true                       # joint paradigm only
    perturbed_dataset_name: "bang_energy_pendulum"           # required when enabled
    ctrl_lambda: 50.0
    train_steps: 200
    lr: 1.0e-4

  seed: 42
  log_interval: 10
  experiment_name: "pendulum_baseline"
  dataset_name: "basic_pendulum"


lqr_controller_cfg:
  q_scale: 1000.0
  q_epsilon_scale: 0.0
  r_scale: 0.0001
  scale_B: false

  stability_analysis:
    epsilon_x: 0.3                # max tracking error in x-space
    eta: 0.1                      # latent-space displacement bound
    use_optimization: true        # run SDP (no-prepend) or L-BFGS α (prepend) optimizer

  eval_cfg_path: "config/exp_cfgs/eval/pendulum.yaml"

  koopman_experiment_name: "pendulum_baseline"
  output_name: "pendulum_baseline"
